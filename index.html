<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body style="font-family: URW Chancery L, cursive; background-image: url(./underwater-pixel-paradise-stockcake.jpg); background-size: cover; height: 100%" >

  <!--welcome screen-->
  <div class="window" id="welcome" style="transform: translate(-50%, -50%); top: 25%; left: 20%">
        <div class="windowheader" id="welcomeheader">
            <h1 style="padding: 4px; margin: 4px; border-radius: 10px; background-color: #2a8fc2; color: #fff"> Underwater OS </h1>
        </div>    
        <p> Welcome! </p>
        <img style="width: 225px; height: 90px; border-radius:32px; object-fit:cover" src="./beach_background_start.jpg" />
        <p class="closebutton" id="welcomeclose"></p>
    </div>

    <!--bottom bar-->
    <div class="taskbar" style="display: flex; justify-content: space-between; padding: 2px; position: fixed; bottom: 0; left: 0; width: 100%; backdrop-filter: blur(5px); background-color:rgba(13, 56, 101, 0.4)">
        <p style="cursor: pointer" id="welcomeopen"> Underwater OS </p>
        <p id = "timeElement" style="padding-right: 0.4%;"> Time </p>
    </div>
    
    <!--apps-->
    <div class="desktopApps" id="projectsopen" style="padding-top: 20px; padding-left: 16px; display: inline-block; text-align: center; cursor: pointer; border-radius: 25px; border-color:rgba(13, 56, 101, 0.4)"> 
        <img src="./bubbleicon_1.png" style="width: 64px; height: 64px; border-radius: 20px; display: block;">
        <p style="margin: 4px 0;"> Projects </p>
    </div>

    <div class="window" id="projects" style="top: 30%; left: 20%; display: none;">
        <div class="windowheader" id="projectsheader">
            <p class="headertext" style="margin: 0; flex-grow: 1;"> Projects </p>
            <p class="closebutton" id="projectsclose"></p>
        </div>
    </div>

    <script src="script.js"> </script>

</body>

</html>
